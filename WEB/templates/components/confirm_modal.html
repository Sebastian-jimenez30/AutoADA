{# Modal global para confirmar Delete/Purge #}
<div id="confirmModal" class="confirm-modal" hidden>
  <div class="confirm-modal__dialog">
    <h4>Confirma ejecución de Delete/Purge</h4>
    <p>Ejecuta los archivos generados en HSH y confirma para continuar.</p>

    <ul id="confirmList" class="confirm-modal__list"></ul>

    <div class="confirm-modal__actions">
      <button type="button" class="btn btn-secondary" id="confirmCancel">Cancelar</button>
      <button type="button" class="btn btn-primary" id="confirmAccept">Ya ejecuté</button>
    </div>
  </div>
</div>
